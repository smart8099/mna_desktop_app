name: Build installers

# Builds the desktop installers on their native OS — Tauri cannot
# cross-compile a Windows installer from macOS (or vice versa), so this runs
# a matrix of native runners instead.
#
# Push a version tag (e.g. `git tag v0.1.0 && git push --tags`) to build both
# platforms and attach the installers to a draft GitHub Release for review.
# `workflow_dispatch` lets you re-run the build manually (e.g. to check the
# pipeline itself still compiles) without cutting a new tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macos-latest runners are Apple Silicon, so building for the host
          # target alone produces an arm64-only .dmg that refuses to launch
          # on Intel Macs ("not supported on this Mac"). Adding both targets
          # lets tauri-action build a universal binary that runs on either.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install

      # Builds the app and, on a real version-tag push, creates/updates a draft
      # GitHub Release with this OS's installer(s) attached. tauri-action reads
      # the version from src-tauri/tauri.conf.json for __VERSION__. The
      # TAURI_SIGNING_PRIVATE_KEY* secrets sign the updater artifact (required
      # because tauri.conf.json has createUpdaterArtifacts: true); uploading
      # latest.json is what lets the in-app updater find this release.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: "MNA Management System v__VERSION__"
          releaseBody: "See the assets below to download this version."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

      # A manual workflow_dispatch run (no tag) just builds the installers to
      # confirm the pipeline still compiles — no release is created, since
      # there's no version tag to attach one to. Still needs the signing key
      # so the build itself succeeds (createUpdaterArtifacts requires it).
      - name: Build only (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
